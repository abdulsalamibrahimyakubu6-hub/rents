components:
  schemas:
    LandlordProfile:
      type: object
      properties:
        phone:
          type: string
          maxLength: 20
        company_name:
          type: string
          maxLength: 255
    MaintenanceRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rental:
          type: integer
        tenant:
          type: integer
          readOnly: true
        tenant_username:
          type: string
          readOnly: true
        property_title:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/MaintenanceRequestStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - property_title
      - rental
      - tenant
      - tenant_username
      - title
      - updated_at
    MaintenanceRequestStatusEnum:
      enum:
      - pending
      - in_progress
      - resolved
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `in_progress` - In Progress
        * `resolved` - Resolved
        * `cancelled` - Cancelled
    PatchedMaintenanceRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rental:
          type: integer
        tenant:
          type: integer
          readOnly: true
        tenant_username:
          type: string
          readOnly: true
        property_title:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/MaintenanceRequestStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rental:
          type: integer
        property_title:
          type: string
          readOnly: true
        tenant_username:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        date_paid:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/PaymentStatusEnum'
    PatchedProperty:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        address:
          type: string
          maxLength: 255
        rent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
        landlord:
          type: integer
          readOnly: true
        landlord_username:
          type: string
          readOnly: true
    PatchedRental:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        property:
          type: integer
        property_title:
          type: string
          readOnly: true
        tenant:
          type: integer
          readOnly: true
        tenant_username:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RentalStatusEnum'
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          $ref: '#/components/schemas/RoleEnum'
        landlord_profile:
          allOf:
          - $ref: '#/components/schemas/LandlordProfile'
          readOnly: true
        tenant_profile:
          allOf:
          - $ref: '#/components/schemas/TenantProfile'
          readOnly: true
    Payment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rental:
          type: integer
        property_title:
          type: string
          readOnly: true
        tenant_username:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        date_paid:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/PaymentStatusEnum'
      required:
      - amount
      - date_paid
      - id
      - property_title
      - rental
      - tenant_username
    PaymentStatusEnum:
      enum:
      - pending
      - completed
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `failed` - Failed
    PriorityEnum:
      enum:
      - low
      - medium
      - high
      - urgent
      type: string
      description: |-
        * `low` - Low
        * `medium` - Medium
        * `high` - High
        * `urgent` - Urgent
    Property:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        address:
          type: string
          maxLength: 255
        rent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
        landlord:
          type: integer
          readOnly: true
        landlord_username:
          type: string
          readOnly: true
      required:
      - address
      - id
      - landlord
      - landlord_username
      - rent_amount
      - title
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 6
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - id
      - password
      - username
    Rental:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        property:
          type: integer
        property_title:
          type: string
          readOnly: true
        tenant:
          type: integer
          readOnly: true
        tenant_username:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RentalStatusEnum'
      required:
      - end_date
      - id
      - property
      - property_title
      - start_date
      - tenant
      - tenant_username
    RentalStatusEnum:
      enum:
      - pending
      - active
      - completed
      - canceled
      type: string
      description: |-
        * `pending` - Pending
        * `active` - Active
        * `completed` - Completed
        * `canceled` - Canceled
    RoleEnum:
      enum:
      - landlord
      - tenant
      type: string
      description: |-
        * `landlord` - Landlord
        * `tenant` - Tenant
    TenantProfile:
      type: object
      properties:
        phone:
          type: string
          maxLength: 20
        emergency_contact:
          type: string
          maxLength: 255
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          $ref: '#/components/schemas/RoleEnum'
        landlord_profile:
          allOf:
          - $ref: '#/components/schemas/LandlordProfile'
          readOnly: true
        tenant_profile:
          allOf:
          - $ref: '#/components/schemas/TenantProfile'
          readOnly: true
      required:
      - id
      - landlord_profile
      - tenant_profile
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
